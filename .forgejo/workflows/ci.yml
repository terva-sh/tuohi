# Forgejo CI for tuohi, the gate for internal pull requests.
#
# The steps match `just ci`. The commands are inline because the container
# does not install just, so a change to one belongs in the other.
#
# Everything runs with CGO_ENABLED=0, the way consumers build tuohi, and
# in both modules: the library and examples/, its reference programs. The check
# job's Alpine container has no display or WebKitGTK, so its GUI scenarios
# skip; the gui job runs them on Debian, on both WebKitGTK stacks, so they gate
# a pull request before it merges. The macOS and Windows engines are exercised
# by .github/workflows/ci.yml on the GitHub mirror, after the merge. Checkout comes from the Actions-Mirrors org and Go from the
# internal registry's golang image, as in the other terva-sh repositories.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  check:
    name: Vet, test and cross-build
    runs-on: docker
    container:
      image: container.local.sothr.com/library/golang:1.27-alpine
    steps:
      - name: Install dependencies
        # gcompat: every test binary that reaches purego is linked for glibc's
        # loader, /lib64/ld-linux-x86-64.so.2, even with CGO_ENABLED=0, and
        # cannot start on musl without it. The same holds for any consumer's
        # binary, which is why tuohi targets glibc desktops.
        run: apk add --no-cache git bash make nodejs gcompat

      - name: Checkout
        uses: Actions-Mirrors/forgejo-actions-checkout@v6

      - name: Install ticket checker
        run: GOBIN=/usr/local/bin go install github.com/terva-sh/git-ticket/cmd/git-ticket@v0.24.0

      - name: go vet (linux, darwin, windows)
        run: |
          for m in . examples; do
            (cd $m && go vet ./... && GOOS=darwin go vet ./... && GOOS=windows go vet ./...)
          done

      - name: gofmt check
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: Import restrictions
        run: make --no-print-directory check-imports

      - name: Examples use the public API only
        run: make --no-print-directory check-examples

      - name: Embedded JavaScript
        run: make --no-print-directory js-check

      - name: go test
        run: |
          go test ./...
          cd examples && go test ./...

      # FreeBSD needs purego's fakecgo compiled with -std when cgo is off.
      - name: Cross-build every target
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64 netbsd/amd64; do
            echo "== $t"
            flags=""
            if [ "${t%/*}" = freebsd ]; then flags="-gcflags=github.com/ebitengine/purego/internal/fakecgo=-std"; fi
            for m in . examples; do
              (cd $m && GOOS=${t%/*} GOARCH=${t#*/} go build $flags ./...)
            done
          done

      - name: Ticket store
        run: git ticket check --fix --dry-run --strict

  gui:
    name: GUI scenarios on both WebKitGTK stacks
    runs-on: docker
    container:
      # Docker Hub's Debian image, through the registry's pull-through path:
      # library/ holds only images pushed by hand. It has no node, which the
      # checkout action needs.
      image: container.local.sothr.com/docker/library/golang:1.27-trixie
    steps:
      - name: Install dependencies
        # The runtime libraries only, as AGENTS.md lists them: nothing is
        # compiled against them. libxtst6 is for the permissions scenario's
        # real click.
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends \
            nodejs git xvfb xauth dbus libxtst6 \
            libwebkit2gtk-4.1-0 libwebkitgtk-6.0-4
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: Actions-Mirrors/forgejo-actions-checkout@v6

      # The steps of `just test-gui`. TUOHI_REQUIRE_GUI=1 fails a scenario
      # that would skip, so the job cannot pass by testing nothing, and both
      # stacks run even when the first fails. The examples run as programs
      # here, so a change that breaks how a consumer uses tuohi fails too.
      - name: GUI scenarios and examples
        run: |
          failed=""
          for backend in webkitgtk-6.0 webkit2gtk-4.1; do
            for m in . examples; do
              echo "== $backend $m"
              (cd $m && TUOHI_REQUIRE_GUI=1 TUOHI_BACKEND=$backend dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1000x24' go test -count=1 ./...) || failed="$failed $backend:$m"
            done
          done
          if [ -n "$failed" ]; then echo "GUI scenarios failed on:$failed" >&2; exit 1; fi
