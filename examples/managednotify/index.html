<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Managed notifications</title>
<style>body { font: 16px/1.6 system-ui; margin: 2rem; }</style>
<h1>Managed notifications</h1>
<p>Activate the desktop notification to focus this existing window.</p>
<button id="read">Mark the example room as read and dismiss its notification</button>
<p id="result" role="status"></p>
<script>
document.getElementById('read').onclick = async () => {
  try {
    await window.roomRead();
    document.getElementById('result').textContent = 'Notification cleared.';
  } catch (error) {
    document.getElementById('result').textContent = String(error);
  }
};
</script>
</html>
