# Diagnostic for TKT-01M3MWY0QQQ6J07DHDY0CCBN2V (Stop dropping a data: page's
# binding call on Windows now and then). Runs on this branch only, and is
# removed before the branch merges. Each job launches the test binary 10
# times; each launch runs the Windows GUI scenarios once and then the data:
# scenario 200 more times, with the WebView2 debug trace on.
name: diag-dataurl

on:
  push:
    branches: ['fix/windows-data-sender-flake']

permissions:
  contents: read

jobs:
  repeat:
    name: data URL repeat ${{ matrix.shard }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Repeat the data URL scenario
        timeout-minutes: 30
        env:
          WEBVIEW2_DEBUG: '1'
          TUOHI_REPEAT_DATAURL: '200'
        shell: pwsh
        run: |
          go test -c -o appkit_test.exe .
          $failed = 0
          for ($launch = 1; $launch -le 10; $launch++) {
            Write-Host "== launch $launch"
            $p = Start-Process -FilePath .\appkit_test.exe `
              -ArgumentList '-test.v','-test.timeout=240s' `
              -NoNewWindow -PassThru `
              -RedirectStandardOutput out.txt -RedirectStandardError err.txt
            $exited = $p.WaitForExit(260000)
            if (-not $exited) {
              Write-Host "::error::launch $launch timed out; force-killing"
              Stop-Process -Id $p.Id -Force
              $failed++
              continue
            }
            # The trace is long; print it only for a launch that failed.
            Get-Content err.txt | Select-String -Pattern '^dataURL' | ForEach-Object { $_.Line } | Select-Object -Last 1
            if ($p.ExitCode -ne 0) {
              $failed++
              Write-Host "::error::launch $launch failed"
              Get-Content out.txt
              Get-Content err.txt
            }
          }
          exit $failed
